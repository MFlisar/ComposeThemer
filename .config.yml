# Publishing
# --
publish:
  group-id: io.github.mflisar.composethemer
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central # [none, maven-central, github]
  test-target: github # [none, maven-central, github]

# Java and developer
# --
config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# Demo apps
# --
apps:
  - name: ComposeThemer Demo
    namespace: com.michaelflisar.composethemer.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/android
      - demo/app/jvm
      - demo/app/wasm
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

# Project
# --
project:
  namespace: com.michaelflisar.composethemer
  repo-name: ComposeThemer
  release: 2021
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# Modules
# --
modules:
  primary-artifact-id: core
  modules:
    - artifact-id: core
      description: provides all the basic ComposeThemer classes to use and apply Themes
      path: library/core
    - artifact-id: modules-picker
      description: provides states and composables to create a theme picker UI
      path: library/modules/picker
    - artifact-id: modules-defaultpicker
      description: provides a default theme picker UI
      path: library/modules/defaultpicker
    - artifact-id: themes-flatui
      description: provides a list of themes based on the 20 flatui colors (each one in 5 variations)
      path: library/modules/themes/flatui
    - artifact-id: themes-material500
      description: provides a list of themes based on the 19 material500 colors (each one in 5 variations)
      path: library/modules/themes/material500
    - artifact-id: themes-metro
      description: provides a list of themes based on the 20 metro colors (each one in 5 variations)
      path: library/modules/themes/metro
  xcframeworks: []

# Documentation
# --
documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
